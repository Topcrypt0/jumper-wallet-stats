<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Urbanist,sans-serif;color:#fff;background:#120f29;
  background-image:radial-gradient(55% 60% at 10% 0%,rgba(135,0,184,.6),transparent 70%),radial-gradient(50% 60% at 95% 15%,rgba(101,59,163,.7),transparent 70%),radial-gradient(70% 60% at 50% 120%,rgba(190,160,235,.25),transparent 70%);
  padding:56px 64px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:14px;font-weight:800;font-size:30px}
.mark{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#bea0eb,#8700b8);display:grid;place-items:center}
.pill{font-weight:700;font-size:22px;color:#bea0eb;border:1.5px solid rgba(190,160,235,.45);background:rgba(190,160,235,.12);padding:10px 22px;border-radius:999px}
h1{font-size:84px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:54px}
h1 span{background:linear-gradient(90deg,#bea0eb,#f1e6ff 50%,#bea0eb);-webkit-background-clip:text;color:transparent}
p{font-size:30px;color:#cfc6f0;margin-top:20px;font-weight:600}
.tiles{display:flex;gap:18px;margin-top:auto}
.t{flex:1;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.13);border-radius:22px;padding:20px 24px}
.t .k{color:#a79fd0;font-size:21px;font-weight:600}
.t .v{font-size:40px;font-weight:800;margin-top:4px}
</style></head><body>
<div class="top">
  <div class="logo"><div class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 16c4 0 4-8 8-8s4 8 8 8" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></div>Wallet Stats</div>
  <div class="pill">No wallet connect · Open source</div>
</div>
<h1>How early are you<br>on <span>Jumper</span>?</h1>
<p>Paste any address. See your volume, txs, chains and first tx.</p>
<div class="tiles">
  <div class="t"><div class="k">First tx</div><div class="v">20??</div></div>
  <div class="t"><div class="k">Volume</div><div class="v">$???K</div></div>
  <div class="t"><div class="k">Transactions</div><div class="v">???</div></div>
  <div class="t"><div class="k">Chains</div><div class="v">??</div></div>
</div>
</body></html>
